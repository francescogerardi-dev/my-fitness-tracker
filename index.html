<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - V.3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script type="module" src="./js/app.js"></script>
    <style>
		/* Aggiungi questo in cima alle regole CSS */
		* { box-sizing: border-box; }
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --primary: #38bdf8; --danger: #ef4444; --success: #4ade80; --warning: #fbbf24;
            --ultra: #a855f7;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .btn-login { padding: 15px 30px; background: var(--primary); color: #0f172a; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; background: var(--card); border-radius: 12px; padding: 5px; border: 1px solid #334155; }
        .tab-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 10px; flex: 1; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--bg); color: var(--primary); }
        .content { display: none; }
        .content.active { display: block; }
        .stat-card { background: var(--card); padding: 15px 25px; border-radius: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; border: 1px solid #334155; border-left: 6px solid var(--primary); }
        #moodIcon { font-size: 2.8rem; }
        .week-nav, .filter-section { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .nav-arrow, select { background: var(--card); border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .tiles-container { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .sport-tile { background: var(--card); flex: 1; min-width: 70px; padding: 12px 5px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .sport-tile.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
        .chart-box { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 20px; }
        .heatmap-container { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
        .heat-day { aspect-ratio: 1; border-radius: 3px; background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .heat-low { background: rgba(239, 68, 68, 0.6) !important; }
        .heat-mid { background: rgba(56, 189, 248, 0.6) !important; }
        .heat-high { background: rgba(74, 222, 128, 0.7) !important; }
        .heat-ultra { background: rgba(168, 85, 247, 0.8) !important; border-color: var(--ultra) !important; }
        .btn-save { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 8px; font-weight: bold; color: #0f172a; cursor: pointer; }
		/* Rimuovi le vecchie regole #historyList * e sostituiscile con queste */
		.history-item {
		    background: var(--card);
		    padding: 12px;
		    border-radius: 8px;
		    margin-bottom: 10px;
		    display: flex;
		    justify-content: space-between;
		    align-items: center;
		    border: 1px solid #334155;
		}
		
		.btn-delete {
		    background: var(--danger) !important;
		    color: white !important;
		    border: none !important;
		    border-radius: 6px !important;
		    padding: 6px 12px !important;
		    cursor: pointer !important;
		    font-weight: bold !important;
		    display: block !important;
		    min-width: 35px;
		}
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <h2 style="margin-bottom: 20px;">Fitness Tracker Cloud</h2>
        <button class="btn-login" onclick="window.login()">Accedi con Google</button>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('main')">Dashboard</button>
            <button class="tab-btn" onclick="showTab('analisi')">Analisi</button>
            <button class="tab-btn" onclick="showTab('history')">Storico</button>
            <button class="tab-btn" onclick="showTab('input')">Nuovo</button>
			<button class="tab-btn" onclick="showTab('routine')">Routine</button>
        </div>

        <div id="main" class="content active">
            <div class="week-nav">
                <button class="nav-arrow" onclick="changeWeek(-7)">❮</button>
                <div id="currentWeekLabel" style="font-weight: bold;">--</div>
                <button class="nav-arrow" onclick="changeWeek(7)">❯</button>
            </div>
            <div class="stat-card" id="mainStatCard">
                <span id="moodIcon"></span>
                <div class="stat-text">
                    <span id="costanzaVal" style="font-size: 1.6rem; font-weight: bold; display: block;">0 / 7 Punti</span>
                    <span id="statusMessage" style="font-size: 1rem; color: #94a3b8; font-style: italic;">Sincronizzazione...</span>
                </div>
                <button onclick="window.logout()" style="margin-left: auto; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.7rem;">LOGOUT</button>
            </div>
			<div id="suggestionCard" class="stat-card" style="border-left-color: var(--ultra); background: rgba(168, 85, 247, 0.05); margin-top: -10px; margin-bottom: 15px; padding: 10px 20px;">
			   ><div class="stat-text">
			        <span style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Suggerimento Coach</span>
			        ♻️<span id="suggestionText" style="font-weight: bold; display: block; color: var(--text);">Analisi in corso...</span>
					<span id="" style="font-weight: bold; display: block; color: var(--text);">&nbsp;</span>
					♻️<span id="suggestionText2" style="font-weight: bold; display: block; color: var(--text);">Analisi in corso...</span>
					<span id="" style="font-weight: bold; display: block; color: var(--text);">&nbsp;</span>
					♻️<span id="suggestionText3" style="font-weight: bold; display: block; color: var(--text);">Analisi in corso...</span>
			    </div>
			</div>
			
            <div class="chart-box" style="height: 200px;"><canvas id="mainChart"></canvas></div>
            <div class="chart-box"><div id="annualHeatmap" class="heatmap-container"></div></div>
        </div>

        <div id="analisi" class="content">
            <div class="filter-section">
                <select id="sportFilter" onchange="renderAnalisi()">
				    <option value="Stretching">🧘 Stretching</option>
					<option value="Corsa">🏃 Corsa</option>
				    <option value="Padel">🎾 Padel</option>
				    <option value="Pesi">🏋️ Pesi</option>
				    <option value="Routine">📋 Routine</option> <option value="Peso">⚖️ Peso</option>
				</select>
                <select id="periodFilter" onchange="renderAnalisi()">
                    <option value="15">15gg</option><option value="30">30gg</option><option value="60">60gg</option><option value="90">90gg</option>
                </select>
            </div>
            <div class="tiles-container" id="sportTiles"></div>
            <!--<div id="streakContainer" class="stat-card" style="margin-top: 15px; border-left-color: var(--warning); background: rgba(251, 191, 36, 0.05); display: flex; justify-content: space-around; padding: 10px;">
                <div style="text-align: center;"><span style="font-size: 0.7rem; color: #94a3b8;">STREAK</span><span id="currentStreak" style="font-size: 1.8rem; font-weight: bold; color: var(--warning); display: block;">0</span></div>
                <div style="text-align: center;"><span style="font-size: 0.7rem; color: #94a3b8;">RECORD</span><span id="bestStreak" style="font-size: 1.8rem; font-weight: bold; color: var(--success); display: block;">0</span></div>
            </div>-->
			<div id="analisiStats" class="stat-grid" style="margin-bottom: 20px;"></div>
            <div class="chart-box" style="height: 300px;"><canvas id="analysisChart"></canvas></div>
        </div>

        <div id="history" class="content"><div id="historyList"></div></div>

        <div id="input" class="content">
            <div style="background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid #334155; max-width: 500px; margin: 0 auto;">
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button onclick="quickSave('Padel', 90)" style="flex: 1; padding: 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; font-weight: bold; cursor: pointer;">🎾 Padel</button>
                    <button onclick="quickSave('Stretching', 20)" style="flex: 1; padding: 12px; background: rgba(74, 222, 128, 0.1); border: 1px solid var(--success); color: var(--success); border-radius: 8px; font-weight: bold; cursor: pointer;">🧘 Stretch</button>
                </div>
                <input type="date" id="dateIn">
                <select id="typeIn" onchange="toggleFields()">
				    <option value="Riposo">Solo Peso / Riposo</option>
				    <option value="Corsa">Corsa</option>
				    <option value="Padel">Padel</option>
				    <option value="Stretching">Stretching</option>
				    <option value="Pesi">Pesi</option>
				    <option value="Routine">Routine</option> 
				</select>
                <div id="kmBox" class="hidden"><input type="number" id="kmIn" step="0.1" placeholder="KM"></div>
                <div id="minBox" class="hidden"><input type="number" id="minIn" placeholder="Minuti"></div>
                <input type="number" id="weightIn" step="0.1" placeholder="Peso (kg)">
                <button class="btn-save" onclick="handleSave()">SALVA</button>
            </div>
        </div>
   

<div id="routine" class="content">
    <div style="background: var(--card); border: 1px solid #334155; border-radius: 16px; padding: 20px;">
        
        <h3 style="margin: 0 0 20px 0; color: var(--primary); font-size: 1.1rem;">Nuovo Esercizio</h3>
        
        <div id="routineForm" style="display: flex; flex-direction: column; gap: 12px;">
            
            <input type="text" id="exName" placeholder="Nome (es. Plank)" 
                   style="margin: 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit;">
            
            <div style="display: flex; gap: 10px;">
                <input type="number" id="exDuration" placeholder="Sec" 
                       style="flex: 1; min-width: 0; margin: 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit;">
                
                <input type="text" id="exImg" placeholder="URL Immagine" 
                       style="flex: 2; min-width: 0; margin: 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit;">
            </div>
            
            <textarea id="exNote" placeholder="Note..." 
                      style="margin: 0; padding: 12px; height: 60px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit; resize: none;"></textarea>
            
            <button class="btn-save" onclick="addExercise()" style="margin: 0;">AGGIUNGI</button>
        </div>
    </div>

    <h3 style="margin: 25px 0 15px 5px; font-size: 1rem; opacity: 0.7;">La tua Routine</h3>
    <div id="exerciseList"></div>
	<div style="margin-top: 30px; padding-bottom: 50px;">
        <button class="btn-save" onclick="completeRoutine()" 
                style="background: var(--success); color: #0f172a; font-size: 1.1rem;">
            ✅ FINE ALLENAMENTO
        </button>
    </div>
</div>
</div>
		 </div>
