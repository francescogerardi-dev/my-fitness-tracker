<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - V.1.9.5</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
		/* Aggiungi questo in cima alle regole CSS */
		* { box-sizing: border-box; }
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --primary: #38bdf8; --danger: #ef4444; --success: #4ade80; --warning: #fbbf24;
            --ultra: #a855f7;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .btn-login { padding: 15px 30px; background: var(--primary); color: #0f172a; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; background: var(--card); border-radius: 12px; padding: 5px; border: 1px solid #334155; }
        .tab-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 10px; flex: 1; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--bg); color: var(--primary); }
        .content { display: none; }
        .content.active { display: block; }
        .stat-card { background: var(--card); padding: 15px 25px; border-radius: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; border: 1px solid #334155; border-left: 6px solid var(--primary); }
        #moodIcon { font-size: 2.8rem; }
        .week-nav, .filter-section { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .nav-arrow, select { background: var(--card); border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .tiles-container { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .sport-tile { background: var(--card); flex: 1; min-width: 70px; padding: 12px 5px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .sport-tile.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
        .chart-box { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 20px; }
        .heatmap-container { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
        .heat-day { aspect-ratio: 1; border-radius: 3px; background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .heat-low { background: rgba(239, 68, 68, 0.6) !important; }
        .heat-mid { background: rgba(56, 189, 248, 0.6) !important; }
        .heat-high { background: rgba(74, 222, 128, 0.7) !important; }
        .heat-ultra { background: rgba(168, 85, 247, 0.8) !important; border-color: var(--ultra) !important; }
        .btn-save { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 8px; font-weight: bold; color: #0f172a; cursor: pointer; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

            </div>
        </div>
   

<div id="routine" class="content">

        <h3 style="margin: 0 0 20px 0; color: var(--primary); font-size: 1.1rem;">Nuovo Esercizio</h3>

</div>
</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import  { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
			    apiKey: "AIzaSyATggTs_IGw_KMu-y3I7Vre5HnKbeyhAm4",
    authDomain: "myfitnesstracker-f2089.firebaseapp.com",
    projectId: "myfitnesstracker-f2089",
    storageBucket: "myfitnesstracker-f2089.firebasestorage.app",
    messagingSenderId: "229779508819",
    appId: "1:229779508819:web:d62f6a5e7abe89e75000a6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
				// Rendiamo le funzioni Firebase globali per usarle nei pulsanti
		        window.addDoc = addDoc;
		        window.doc = doc;
		        window.deleteDoc = deleteDoc;
		        window.updateDoc = updateDoc;
		        window.collection = collection;
		        window.db = db;
                document.getElementById('loginOverlay').classList.add('hidden');
                const q = query(collection(db, "users", user.uid, "records"), orderBy("date", "asc"));
                onSnapshot(q, (snapshot) => {
                    window.fitnessDB = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderChart();
                    renderHeatmap();
					updateSuggestion();
					window.updateDoc = updateDoc;
					window.doc = doc;
					window.db = db;
                    if(document.getElementById('analisi').classList.contains('active')) renderAnalisi();
                    document.getElementById('statusMessage').innerText = "Dati aggiornati";
					// Sotto il listener di fitnessDB esistente
					const qRoutine = query(collection(db, "users", user.uid, "routine"), orderBy("order", "asc"));
					onSnapshot(qRoutine, (snapshot) => {
					    window.routineDB = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
					    if(document.getElementById('routine').classList.contains('active')) renderRoutine();
});
                });
            } else {
                window.currentUser = null;
                document.getElementById('loginOverlay').classList.remove('hidden');
            }
        });

        window.handleSave = async () => {
            const entry = {
                date: document.getElementById('dateIn').value,
                type: document.getElementById('typeIn').value,
                weight: parseFloat(document.getElementById('weightIn').value) || null,
                km: parseFloat(document.getElementById('kmIn').value) || 0,
                min: parseInt(document.getElementById('minIn').value) || 0
            };
            await addDoc(collection(db, "users", window.currentUser.uid, "records"), entry);
            showTab('main');
        };

        window.handleDelete = async (id) => {
            if (confirm("Eliminare?")) await deleteDoc(doc(db, "users", window.currentUser.uid, "records", id));
        };

        window.quickSave = async (type, minutes) => {
            let lastW = null;
            if(window.fitnessDB.length > 0) {
                const last = [...window.fitnessDB].sort((a,b)=>new Date(b.date)-new Date(a.date)).find(r=>r.weight > 0);
                if(last) lastW = last.weight;
            }
            await addDoc(collection(db, "users", window.currentUser.uid, "records"), {
                date: formatDateLocal(new Date()), type: type, weight: lastW, km: 0, min: minutes
            });
            showTab('main');
        };
    </script>

    <script>
        window.referenceDate = new Date();
        let mainChart = null, analisiChart = null;
        const icons = { 
		    'Corsa': '🏃', 'Padel': '🎾', 'Stretching': '🧘', 
		    'Pesi': '🏋️', 'Routine': '📋', 'Riposo': '💤' ,'Addominali': '🧱' // Tienilo per i vecchi record così non vedi undefined
		};
        window.fitnessDB = [];

        function formatDateLocal(d) { return d.toISOString().split('T')[0]; }
        function getMonday(d) { d = new Date(d); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); return new Date(d.setDate(diff)); }
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

window.updateSuggestion = () => {
    const sports = ['Corsa', 'Padel', 'Stretching', 'Pesi', 'Routine'];
    const today = new Date();
    let streaks = {};
    let lastSeen = {};

    // 1. Analisi dati
    sports.forEach(s => {
        const sDates = [...new Set(window.fitnessDB
            .filter(r => r.type === s)
            .map(r => r.date))]
            .sort((a, b) => new Date(a) - new Date(b));

        // Calcolo Streak attuale
        let currentStreak = 0;
        if (sDates.length > 0) {
            let tempStreak = 0;
            const sortedDesc = [...sDates].sort((a,b) => new Date(b) - new Date(a));
            
            // Verifichiamo se l'attività è recente (oggi o ieri)
            const lastDate = new Date(sortedDesc[0]);
            const diffDays = (today - lastDate) / (1000 * 60 * 60 * 24);
            
            if (diffDays <= 1.5) { // Se fatta oggi o ieri
                tempStreak = 1;
                for (let i = 0; i < sortedDesc.length - 1; i++) {
                    const d1 = new Date(sortedDesc[i]);
                    const d2 = new Date(sortedDesc[i+1]);
                    if ((d1 - d2) / (1000 * 60 * 60 * 24) === 1) tempStreak++;
                    else break;
                }
            }
            currentStreak = tempStreak;
            lastSeen[s] = lastDate;
        } else {
            lastSeen[s] = new Date(0); // Mai fatta
        }
        streaks[s] = currentStreak;
    });

   // 2. Elaborazione suggerimento (V.2.1)
    let suggestion = "";
    const activeStreaks = Object.entries(streaks).filter(([s, val]) => val > 2);

    if (activeStreaks.length > 0) {
        // Caso Streak > 2: prendiamo il massimo
        const maxVal = Math.max(...activeStreaks.map(x => x[1]));
        const topSports = activeStreaks
            .filter(x => x[1] === maxVal)
            .map(x => `${icons[x[0]]} ${x[0]} (${maxVal} giorni 🔥)`); // Aggiunto il numero dello streak
        
        suggestion = `Continua così! Mantieni lo streak di: ${topSports.join(' e ')}`;
    } else {
        // Caso No Streak: prendiamo l'attività più "vecchia"
        const sortedByLast = Object.entries(lastSeen).sort((a, b) => a[1] - b[1]);
        const oldestSport = sortedByLast[0][0];
        
        // Calcoliamo da quanti giorni manca
        const diffDays = Math.floor((today - sortedByLast[0][1]) / (1000 * 60 * 60 * 24));
        const missingTime = diffDays > 365 ? "molto tempo" : `${diffDays} giorni`;
        
        suggestion = `È ora di riprendere: ${icons[oldestSport]} ${oldestSport} (manca da ${missingTime})`;
    }

    document.getElementById('suggestionText').innerText = suggestion;
};

window.addExercise = async () => {
    const name = document.getElementById('exName').value;
    if(!name) { alert("Nome obbligatorio"); return; }
    
    // Usiamo le versioni globali window.addDoc etc.
    const exercise = {
        name: name,
        duration: document.getElementById('exDuration').value || null,
        img: document.getElementById('exImg').value || null,
        note: document.getElementById('exNote').value || "",
        order: (window.routineDB?.length || 0) + 1,
        createdAt: new Date()
    };
    
    try {
        await window.addDoc(window.collection(window.db, "users", window.currentUser.uid, "routine"), exercise);
        // Pulizia campi
        document.getElementById('exName').value = '';
        document.getElementById('exDuration').value = '';
        document.getElementById('exImg').value = '';
        document.getElementById('exNote').value = '';
    } catch (e) {
        console.error("Errore salvataggio:", e);
    }
};
window.moveEx = async (id, direction) => {
    const ex = window.routineDB.find(e => e.id === id);
    const other = window.routineDB.find(e => e.order === ex.order + direction);
    if(!other) return;
    
    // Switch degli ordini (implementare con updateDoc su Firebase)
    const exRef = doc(db, "users", window.currentUser.uid, "routine", id);
    const otherRef = doc(db, "users", window.currentUser.uid, "routine", other.id);
    
    await updateDoc(exRef, { order: other.order });
    await updateDoc(otherRef, { order: ex.order });
};

window.completeRoutine = async () => {
    if(!window.routineDB || window.routineDB.length === 0) {
        alert("La tua routine è vuota!");
        return;
    }
    
    if(confirm("Registrare il completamento della Routine? (Include lo Stretching automatico)")) {
        let lastW = null;
        if(window.fitnessDB.length > 0) {
            const last = [...window.fitnessDB].sort((a,b)=>new Date(b.date)-new Date(a.date)).find(r=>r.weight > 0);
            if(last) lastW = last.weight;
        }

        const today = formatDateLocal(new Date());

        try {
            // Eseguiamo entrambi i salvataggi contemporaneamente
            await Promise.all([
                // 1. Il record della Routine (1 punto)
                window.addDoc(window.collection(window.db, "users", window.currentUser.uid, "records"), {
                    date: today,
                    type: 'Routine',
                    weight: lastW,
                    km: 0,
                    min: 0 
                }),
                // 2. Il record dello Stretching (0.5 punti)
                window.addDoc(window.collection(window.db, "users", window.currentUser.uid, "records"), {
                    date: today,
                    type: 'Stretching',
                    weight: lastW,
                    km: 0,
                    min: 10 // Tempo stimato per lo stretching incluso
                })
            ]);

            showTab('main'); 
        } catch (e) {
            console.error("Errore nel doppio salvataggio:", e);
        }
    }
};

window.deleteEx = async (id) => {
    if(confirm("Eliminare esercizio?")) 
        await deleteDoc(doc(db, "users", window.currentUser.uid, "routine", id));
};
window.renderRoutine = () => {
    const list = document.getElementById('exerciseList');
    if(!window.routineDB) return;
    const sorted = [...window.routineDB].sort((a,b) => a.order - b.order);
    
    list.innerHTML = sorted.map((ex) => `
        <div class="stat-card" style="margin-bottom:10px; padding:15px; border-left-color: var(--primary); box-sizing: border-box; width: 100%;">
            <div style="width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border-radius:8px; overflow:hidden;">
                ${ex.img ? `<img src="${ex.img}" style="width:100%; height:100%; object-fit:cover;">` : '<span style="font-size:1.5rem;">🏋️</span>'}
            </div>
            <div style="flex-grow:1; min-width:0;">
                <b style="font-size:0.9rem; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ex.name}</b>
                ${ex.duration ? `<small style="color:var(--primary); font-weight:bold;">${ex.duration}s</small>` : ''}
                ${ex.note ? `<small style="color:#94a3b8; font-style:italic; margin-left:10px;">${ex.note}</small>` : ''}
            </div>
            <div style="display:flex; flex-direction:column; gap:5px; flex-shrink:0;">
                <button onclick="moveEx('${ex.id}', -1)" class="nav-arrow" style="padding:2px 8px; font-size:0.6rem;">▲</button>
                <button onclick="moveEx('${ex.id}', 1)" class="nav-arrow" style="padding:2px 8px; font-size:0.6rem;">▼</button>
                <button onclick="deleteEx('${ex.id}')" style="background:var(--danger); border:none; color:white; border-radius:4px; cursor:pointer; font-size:0.6rem; padding:4px;">X</button>
            </div>
        </div>
    `).join('');
};
		
        window.showTab = (id) => {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'main') { renderChart(); renderHeatmap(); }
            if(id === 'analisi') renderAnalisi();
            if(id === 'history') renderHistory();
            if(id === 'input') {
                document.getElementById('dateIn').valueAsDate = new Date();
                const last = [...window.fitnessDB].sort((a,b)=>new Date(b.date)-new Date(a.date)).find(r=>r.weight > 0);
                if(last) document.getElementById('weightIn').value = last.weight;
            }
			if(id === 'routine') renderRoutine();
        };

        window.changeWeek = (days) => { window.referenceDate.setDate(window.referenceDate.getDate() + days); renderChart(); };

       window.renderChart = () => {
		    const monday = getMonday(window.referenceDate);
		    const labels = [];
		    for(let i=0; i<7; i++) { 
		        let d = new Date(monday); d.setDate(monday.getDate() + i); 
		        labels.push(formatDateLocal(d));
		    }
    document.getElementById('currentWeekLabel').innerText = `Sett. ${monday.getDate()}/${monday.getMonth()+1}`;
    
    const grouped = window.fitnessDB.reduce((acc, curr) => {
        if(!acc[curr.date]) acc[curr.date] = { weight: null, activities: [] };
        if(curr.type !== 'Riposo') acc[curr.date].activities.push(curr.type);
        if(curr.weight) acc[curr.date].weight = curr.weight; return acc;
    }, {});

    // --- LOGICA COSTANZA E MESSAGGI ---
    let score = 0;
    labels.forEach(day => {
        const acts = window.fitnessDB.filter(r => r.date === day);
        if(acts.some(r => !['Stretching', 'Riposo'].includes(r.type))) score += 1;
        else if(acts.some(r => r.type === 'Stretching')) score += 0.5;
    });

    document.getElementById('costanzaVal').innerText = `${score} / 7 Punti`;
    const icon = document.getElementById('moodIcon'), msg = document.getElementById('statusMessage'), card = document.getElementById('mainStatCard');
    
    if(score >= 3.5) { 
        icon.innerText = '🔥'; card.style.borderLeftColor = 'var(--success)'; 
        msg.innerText = "Obiettivo raggiunto: ottimo lavoro!"; 
    }
    else if(score < 2) { 
        icon.innerText = '⚠️'; card.style.borderLeftColor = 'var(--danger)'; 
        msg.innerText = "Settimana fiacca, serve una scossa!"; 
    }
    else { 
        icon.innerText = '⚖️'; card.style.borderLeftColor = 'var(--warning)'; 
        msg.innerText = "Sei sulla buona strada, continua così!"; 
    }

    const ctx = document.getElementById('mainChart').getContext('2d');
    if(mainChart) mainChart.destroy();
    mainChart = new Chart(ctx, {
        type: 'line',
        data: { 
            labels: labels.map(l => l.split('-').reverse().slice(0,2).join('/')), 
            datasets: [{ data: labels.map(l => grouped[l]?.weight || null), borderColor: '#38bdf8', tension: 0.3, spanGaps: true }] 
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 73, max: 81 } } },
        plugins: [{ 
            afterDraw: chart => { 
                chart.data.datasets[0].data.forEach((v, i) => {
                    const meta = chart.getDatasetMeta(0); if(!meta.data[i]) return;
                    const {x, y} = meta.data[i]; const acts = grouped[labels[i]]?.activities || [];
                    acts.forEach((a, idx) => { 
                        chart.ctx.font = '14px serif'; 

						const iconaDaDisegnare = icons[a] || '⚪'; 
    
                        chart.ctx.fillText(icons[a], x-7, y - 20 - (idx*16)); 
                    });
                });
            }
        }]
    });
};
        window.renderHeatmap = () => {
            const container = document.getElementById('annualHeatmap'); container.innerHTML = '';
            const currentYear = new Date().getFullYear();
            for (let w = 1; w <= 52; w++) {
                let wScore = 0;
                const records = window.fitnessDB.filter(r => { const d = new Date(r.date); return d.getFullYear() === currentYear && getWeekNumber(d) === w; });
                const days = [...new Set(records.map(r => r.date))];
                days.forEach(d => {
                    const acts = records.filter(r => r.date === d);
                    if(acts.some(r => !['Stretching', 'Riposo'].includes(r.type))) wScore += 1;
                    else if(acts.some(r => r.type === 'Stretching')) wScore += 0.5;
                });
                const el = document.createElement('div'); el.className = 'heat-day';
                el.style.display = 'flex'; el.style.flexDirection = 'column'; el.style.lineHeight = '0.9';
                el.innerHTML = `<span style="font-size:0.55rem; opacity:0.5;">${w}</span><b style="font-size:0.75rem;">${wScore}</b>`;
                if(wScore >= 5) el.classList.add('heat-ultra');
                else if(wScore >= 3.5) el.classList.add('heat-high');
                else if(wScore >= 2) el.classList.add('heat-mid');
                else if(wScore > 0) el.classList.add('heat-low');
                el.onclick = () => {
                    let target = new Date(currentYear, 0, 4);
                    target.setDate(target.getDate() + (w - 1) * 7);
                    const day = target.getDay();
                    const diff = target.getDate() - day + (day === 0 ? -6 : 1);
                    const finalMonday = new Date(target.setDate(diff));
                    finalMonday.setHours(12, 0, 0, 0);
                    window.referenceDate = finalMonday; renderChart(); window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                container.appendChild(el);
            }
        };

        window.renderAnalisi = () => {
            const sport = document.getElementById('sportFilter').value;
            const daysCount = parseInt(document.getElementById('periodFilter').value);
            const labelsRaw = []; const labelsFmt = [];
            for(let i=daysCount-1; i>=0; i--) {
                let d = new Date(); d.setDate(d.getDate()-i);
                const raw = formatDateLocal(d);
                labelsRaw.push(raw);
                labelsFmt.push(raw.split('-').reverse().slice(0,2).join('/'));
            }
            
            const tc = document.getElementById('sportTiles'); tc.innerHTML = '';
			    // Lista aggiornata con Routine al posto di Addominali
			    ['Corsa', 'Padel', 'Stretching', 'Pesi', 'Routine'].forEach(s => {
			        // CORREZIONE QUI: Controlliamo se la data del record è nel periodo selezionato 
			        // e se il tipo corrisponde allo sport del tile
			        const cnt = window.fitnessDB.filter(r => 
			            labelsRaw.includes(r.date) && r.type === s
			        ).length;
			        
			        tc.innerHTML += `
			            <div class="sport-tile ${sport === s ? 'active' : ''}">
			                <span>${icons[s] || '⚪'}</span><br>
			                <b>${cnt}</b><br>
			                <small>${s}</small>
			            </div>`;
			    });

            if(sport !== "Peso") {
                document.getElementById('streakContainer').style.display = 'flex';
                const sDates = [...new Set(window.fitnessDB.filter(r=>r.type===sport).map(r=>r.date))].sort((a,b)=>new Date(b)-new Date(a));
                let cur = 0, best = 0;
                if(sDates.length > 0) {
                    let sorted = [...sDates].sort((a,b)=>new Date(a)-new Date(b));
                    let longest = 0, count = 1;
                    for(let i=1; i<sorted.length; i++) {
                        count = (new Date(sorted[i])-new Date(sorted[i-1]))/86400000 === 1 ? count+1 : 1;
                        if(count > longest) longest = count;
                    }
                    best = Math.max(longest, 1);
                    if((new Date(formatDateLocal(new Date()))-new Date(sDates[0]))/86400000 <= 1) {
                        cur = 1; for(let i=0; i<sDates.length-1; i++) { if((new Date(sDates[i])-new Date(sDates[i+1]))/86400000===1) cur++; else break; }
                    }
                }
                document.getElementById('currentStreak').innerText = cur;
                document.getElementById('bestStreak').innerText = best;
            } else { document.getElementById('streakContainer').style.display = 'none'; }

            const ctx = document.getElementById('analisiChart').getContext('2d');
            if(analisiChart) analisiChart.destroy();
            const dataArr = labelsRaw.map(l => {
                const f = window.fitnessDB.filter(r => r.date === l && (sport === 'Peso' ? r.weight : r.type === sport));
                return f.length ? (sport === 'Peso' ? f[f.length-1].weight : 1) : null;
            });

            analisiChart = new Chart(ctx, { 
                type: 'line', 
                data: { labels: labelsFmt, datasets: [{ data: dataArr, borderColor: '#38bdf8', pointRadius: sport==='Peso'?3:0, spanGaps: true, showLine: sport === 'Peso' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, 
                           scales: { y: { display: sport==='Peso', min: sport==='Peso'?73:0, max: sport==='Peso'?84:2 } } 
                },
                plugins: [{
                    afterDraw: chart => {
                        if (sport === 'Peso') return;
                        const meta = chart.getDatasetMeta(0);
                        labelsRaw.forEach((date, i) => {
                            const hasAct = window.fitnessDB.some(r => r.date === date && r.type === sport);
                            if (hasAct && meta.data[i]) {
                                const {x, y} = meta.data[i]; chart.ctx.font = '20px serif'; chart.ctx.textAlign = 'center';
                                chart.ctx.fillText(icons[sport], x, y);
                            }
                        });
                    }
                }]
            });
        };

        window.renderHistory = () => {
            const list = document.getElementById('historyList');
            list.innerHTML = window.fitnessDB.slice().reverse().map(r => `
                <div style="background:var(--card); padding:10px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; border:1px solid #334155;">
                    <div><b>${r.date.split('-').reverse().join('/')}</b> - ${icons[r.type]} ${r.type} ${r.weight? ' | '+r.weight+'kg':''}</div>
                    <button onclick="handleDelete('${r.id}')" style="background:var(--danger); border:none; color:white; border-radius:4px; padding: 2px 8px; cursor:pointer;">X</button>
                </div>`).join('');
        };

        window.toggleFields = () => {
		    const t = document.getElementById('typeIn').value;
		    document.getElementById('kmBox').classList.toggle('hidden', t !== 'Corsa');
		    // Aggiungi 'Routine' nell'elenco che mostra i minuti
		    document.getElementById('minBox').classList.toggle('hidden', !['Corsa','Padel','Stretching','Routine'].includes(t));
		};
    </script>
</body>
</html>
