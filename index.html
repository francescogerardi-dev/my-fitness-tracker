<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - V.2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --primary: #38bdf8; --danger: #ef4444; --success: #4ade80; --warning: #fbbf24;
            --ultra: #a855f7;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Overlay & Tabs */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .btn-login { padding: 15px 30px; background: var(--primary); color: #0f172a; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; background: var(--card); border-radius: 12px; padding: 5px; border: 1px solid #334155; position: sticky; top: 10px; z-index: 100; }
        .tab-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 10px; flex: 1; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }
        .tab-btn.active { background: var(--bg); color: var(--primary); }
        
        .content { display: none; }
        .content.active { display: block; }
        
        /* Cards & Stats */
        .stat-card { background: var(--card); padding: 15px 20px; border-radius: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid #334155; border-left: 6px solid var(--primary); }
        .stat-text { flex: 1; min-width: 0; }
        #moodIcon { font-size: 2.2rem; }
        
        .week-nav, .filter-section { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .nav-arrow, select { background: var(--card); border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        
        /* Tiles & Heatmap */
        .tiles-container { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .sport-tile { background: var(--card); flex: 1; min-width: 65px; padding: 10px 5px; border-radius: 12px; border: 1px solid #334155; text-align: center; font-size: 0.8rem; }
        .sport-tile.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
        
        .chart-box { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 20px; }
        .heatmap-container { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
        .heat-day { aspect-ratio: 1; border-radius: 3px; background: #1e293b; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; line-height: 0.9; }
        
        /* Heatmap Colors */
        .heat-low { background: rgba(239, 68, 68, 0.4) !important; }
        .heat-mid { background: rgba(56, 189, 248, 0.4) !important; }
        .heat-high { background: rgba(74, 222, 128, 0.5) !important; }
        .heat-ultra { background: rgba(168, 85, 247, 0.6) !important; border-color: var(--ultra) !important; }

        /* Form & Inputs */
        .btn-save { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 8px; font-weight: bold; color: #0f172a; cursor: pointer; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <h2 style="margin-bottom: 20px;">Fitness Tracker Cloud</h2>
        <button class="btn-login" onclick="window.login()">Accedi con Google</button>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('main')">Dashboard</button>
            <button class="tab-btn" onclick="showTab('analisi')">Analisi</button>
            <button class="tab-btn" onclick="showTab('history')">Storico</button>
            <button class="tab-btn" onclick="showTab('input')">Nuovo</button>
            <button class="tab-btn" onclick="showTab('routine')">Routine</button>
        </div>

        <div id="main" class="content active">
            <div class="week-nav">
                <button class="nav-arrow" onclick="changeWeek(-7)">❮</button>
                <div id="currentWeekLabel" style="font-weight: bold;">--</div>
                <button class="nav-arrow" onclick="changeWeek(7)">❯</button>
            </div>
            
            <div class="stat-card" id="mainStatCard">
                <span id="moodIcon">🌚</span>
                <div class="stat-text">
                    <span id="costanzaVal" style="font-size: 1.4rem; font-weight: bold; display: block;">0 / 7 Punti</span>
                    <span id="statusMessage" style="font-size: 0.8rem; color: #94a3b8; font-style: italic;">Caricamento...</span>
                </div>
                <button onclick="window.logout()" style="background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.65rem; align-self: flex-start;">LOGOUT</button>
            </div>

            <div id="suggestionCard" class="stat-card" style="border-left-color: var(--ultra); background: rgba(168, 85, 247, 0.05); margin-top: -5px; padding: 12px 20px;">
                <span style="font-size: 1.5rem;">💡</span>
                <div class="stat-text">
                    <span style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Suggerimento Coach</span>
                    <span id="suggestionText" style="font-weight: bold; display: block; color: var(--text); font-size: 0.9rem;">Analisi in corso...</span>
                </div>
            </div>
            
            <div class="chart-box" style="height: 220px;"><canvas id="mainChart"></canvas></div>
            <div class="chart-box"><div id="annualHeatmap" class="heatmap-container"></div></div>
        </div>

        <div id="analisi" class="content">
            <div class="filter-section">
                <select id="sportFilter" onchange="renderAnalisi()">
                    <option value="Corsa">🏃 Corsa</option>
                    <option value="Padel">🎾 Padel</option>
                    <option value="Stretching">🧘 Stretching</option>
                    <option value="Pesi">🏋️ Pesi</option>
                    <option value="Routine">📋 Routine</option> 
                    <option value="Peso">⚖️ Peso</option>
                </select>
                <select id="periodFilter" onchange="renderAnalisi()">
                    <option value="30">30gg</option><option value="60">60gg</option><option value="90">90gg</option>
                </select>
            </div>
            <div class="tiles-container" id="sportTiles"></div>
            <div id="analisiStats" style="display: flex; gap: 10px; margin-bottom: 15px;"></div>
            <div class="chart-box" style="height: 280px;"><canvas id="analysisChart"></canvas></div>
        </div>

        <div id="history" class="content">
            <div id="historyList"></div>
        </div>

        <div id="input" class="content">
            <div style="background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid #334155; max-width: 500px; margin: 0 auto;">
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button onclick="quickSave('Padel', 90)" style="flex: 1; padding: 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; font-weight: bold; cursor: pointer;">🎾 Padel</button>
                    <button onclick="quickSave('Stretching', 20)" style="flex: 1; padding: 12px; background: rgba(74, 222, 128, 0.1); border: 1px solid var(--success); color: var(--success); border-radius: 8px; font-weight: bold; cursor: pointer;">🧘 Stretch</button>
                </div>
                <input type="date" id="dateIn">
                <select id="typeIn" onchange="toggleFields()">
                    <option value="Riposo">Solo Peso / Riposo</option>
                    <option value="Corsa">Corsa</option>
                    <option value="Padel">Padel</option>
                    <option value="Stretching">Stretching</option>
                    <option value="Pesi">Pesi</option>
                    <option value="Routine">Routine</option> 
                </select>
                <div id="kmBox" class="hidden"><input type="number" id="kmIn" step="0.1" placeholder="KM"></div>
                <div id="minBox" class="hidden"><input type="number" id="minIn" placeholder="Minuti"></div>
                <input type="number" id="weightIn" step="0.1" placeholder="Peso (kg)">
                <button class="btn-save" onclick="handleSave()">SALVA</button>
            </div>
        </div>

        <div id="routine" class="content">
            <div style="background: var(--card); border: 1px solid #334155; border-radius: 16px; padding: 20px;">
                <h3 style="margin: 0 0 15px 0; color: var(--primary); font-size: 1rem;">Nuovo Esercizio</h3>
                <div id="routineForm">
                    <input type="text" id="exName" placeholder="Nome (es. Plank)">
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="exDuration" placeholder="Sec" style="flex: 1;">
                        <input type="text" id="exImg" placeholder="URL Immagine" style="flex: 2;">
                    </div>
                    <textarea id="exNote" placeholder="Note..." style="height: 60px; resize: none;"></textarea>
                    <button class="btn-save" onclick="addExercise()">AGGIUNGI</button>
                </div>
            </div>
            <h3 style="margin: 25px 0 15px 5px; font-size: 0.9rem; opacity: 0.7; text-transform: uppercase;">La tua Routine</h3>
            <div id="exerciseList"></div>
            <div style="margin: 30px 0 50px 0;">
                <button class="btn-save" onclick="completeRoutine()" style="background: var(--success); color: #0f172a; font-size: 1rem;">
                    ✅ FINE ALLENAMENTO
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyATggTs_IGw_KMu-y3I7Vre5HnKbeyhAm4",
            authDomain: "myfitnesstracker-f2089.firebaseapp.com",
            projectId: "myfitnesstracker-f2089",
            storageBucket: "myfitnesstracker-f2089.firebasestorage.app",
            messagingSenderId: "229779508819",
            appId: "1:229779508819:web:d62f6a5e7abe89e75000a6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                window.db = db; window.collection = collection; window.addDoc = addDoc;
                window.doc = doc; window.deleteDoc = deleteDoc; window.updateDoc = updateDoc;
                
                document.getElementById('loginOverlay').classList.add('hidden');
                
                // Listener Records
                const q = query(collection(db, "users", user.uid, "records"), orderBy("date", "asc"));
                onSnapshot(q, (snapshot) => {
                    window.fitnessDB = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderChart();
                    renderHeatmap();
                    if (window.updateSuggestion) window.updateSuggestion();
                    if(document.getElementById('analisi').classList.contains('active')) renderAnalisi();
                });

                // Listener Routine
                const qRoutine = query(collection(db, "users", user.uid, "routine"), orderBy("order", "asc"));
                onSnapshot(qRoutine, (snapshot) => {
                    window.routineDB = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if(document.getElementById('routine').classList.contains('active')) renderRoutine();
                });
            } else {
                window.currentUser = null;
                document.getElementById('loginOverlay').classList.remove('hidden');
            }
        });

        window.handleSave = async () => {
            const entry = {
                date: document.getElementById('dateIn').value,
                type: document.getElementById('typeIn').value,
                weight: parseFloat(document.getElementById('weightIn').value) || null,
                km: parseFloat(document.getElementById('kmIn').value) || 0,
                min: parseInt(document.getElementById('minIn').value) || 0
            };
            await addDoc(collection(db, "users", window.currentUser.uid, "records"), entry);
            showTab('main');
        };

        window.handleDelete = async (id) => {
            if (confirm("Eliminare definitivamente?")) await deleteDoc(doc(db, "users", window.currentUser.uid, "records", id));
        };

        window.quickSave = async (type, minutes) => {
            let lastW = null;
            const sorted = [...window.fitnessDB].filter(r => r.weight > 0).sort((a,b) => new Date(b.date) - new Date(a.date));
            if(sorted.length > 0) lastW = sorted[0].weight;
            
            await addDoc(collection(db, "users", window.currentUser.uid, "records"), {
                date: formatDateLocal(new Date()), type: type, weight: lastW, km: 0, min: minutes
            });
            showTab('main');
        };
    </script>

    <script>
        window.referenceDate = new Date();
        let mainChart = null, analisiChart = null;
        const icons = { 'Corsa': '🏃', 'Padel': '🎾', 'Stretching': '🧘', 'Pesi': '🏋️', 'Routine': '📋', 'Riposo': '💤' };
        window.fitnessDB = [];

        function formatDateLocal(d) { return d.toISOString().split('T')[0]; }
        function getMonday(d) { d = new Date(d); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); return new Date(d.setDate(diff)); }
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

        window.updateSuggestion = () => {
            const sports = ['Corsa', 'Padel', 'Stretching', 'Pesi', 'Routine'];
            const oggi = new Date(); oggi.setHours(0,0,0,0);
            let streaks = {}; let lastSeen = {};

            sports.forEach(s => {
                const sDates = [...new Set(window.fitnessDB.filter(r => r.type === s).map(r => r.date))].sort((a,b) => new Date(b) - new Date(a));
                let currentStreak = 0;
                if (sDates.length > 0) {
                    const lastDate = new Date(sDates[0]); lastDate.setHours(0,0,0,0);
                    const diff = Math.floor((oggi - lastDate) / 86400000);
                    if (diff <= 1) {
                        currentStreak = 1;
                        for (let i = 0; i < sDates.length - 1; i++) {
                            const d1 = new Date(sDates[i]); const d2 = new Date(sDates[i+1]);
                            if ((d1 - d2) / 86400000 === 1) currentStreak++; else break;
                        }
                    }
                    lastSeen[s] = lastDate;
                } else { lastSeen[s] = new Date(0); }
                streaks[s] = currentStreak;
            });

            let suggestion = "";
            const activeStreaks = Object.entries(streaks).filter(([s, val]) => val >= 2);
            if (activeStreaks.length > 0) {
                suggestion = `Serie attiva! 🔥 Continua così: ${activeStreaks.map(x => icons[x[0]] + ' ' + x[1] + 'gg').join(', ')}`;
            } else {
                const oldest = Object.entries(lastSeen).sort((a, b) => a[1] - b[1])[0];
                suggestion = `Coach: Riprendiamo con ${icons[oldest[0]]} ${oldest[0]}?`;
            }

            if (window.fitnessDB.some(r => r.date === formatDateLocal(new Date()))) suggestion = "✅ Obiettivo centrato per oggi! Grande.";
            const el = document.getElementById('suggestionText'); if(el) el.innerText = suggestion;
        };

        window.addExercise = async () => {
            const name = document.getElementById('exName').value;
            if(!name) return alert("Nome obbligatorio");
            await window.addDoc(window.collection(window.db, "users", window.currentUser.uid, "routine"), {
                name: name, duration: document.getElementById('exDuration').value || null,
                img: document.getElementById('exImg').value || null, note: document.getElementById('exNote').value || "",
                order: (window.routineDB?.length || 0) + 1
            });
            document.getElementById('routineForm').querySelectorAll('input, textarea').forEach(i => i.value = '');
        };

        window.moveEx = async (id, dir) => {
            const ex = window.routineDB.find(e => e.id === id);
            const other = window.routineDB.find(e => e.order === ex.order + dir);
            if(!other) return;
            await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid, "routine", id), { order: other.order });
            await window.updateDoc(window.doc(window.db, "users", window.currentUser.uid, "routine", other.id), { order: ex.order });
        };

        window.completeRoutine = async () => {
            if(!window.routineDB?.length) return alert("Routine vuota!");
            if(confirm("Registrare completamento? (Include Stretching)")) {
                const today = formatDateLocal(new Date());
                let lastW = null;
                const lastRec = [...window.fitnessDB].filter(r => r.weight > 0).sort((a,b) => new Date(b.date)-new Date(a.date))[0];
                if(lastRec) lastW = lastRec.weight;
                
                await Promise.all([
                    window.addDoc(window.collection(window.db, "users", window.currentUser.uid, "records"), { date: today, type: 'Routine', weight: lastW, km: 0, min: 0 }),
                    window.addDoc(window.collection(window.db, "users", window.currentUser.uid, "records"), { date: today, type: 'Stretching', weight: lastW, km: 0, min: 10 })
                ]);
                showTab('main');
            }
        };

        window.renderRoutine = () => {
            const list = document.getElementById('exerciseList');
            list.innerHTML = window.routineDB.map(ex => `
                <div class="stat-card" style="padding:12px; border-left-color: var(--primary);">
                    <div style="width:45px; height:45px; background:rgba(255,255,255,0.05); border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center;">
                        ${ex.img ? `<img src="${ex.img}" style="width:100%; height:100%; object-fit:cover;">` : '🏋️'}
                    </div>
                    <div class="stat-text">
                        <b style="font-size:0.9rem; display:block;">${ex.name}</b>
                        ${ex.duration ? `<small style="color:var(--primary); font-weight:bold;">${ex.duration}s</small>` : ''}
                        ${ex.note ? `<small style="color:#94a3b8; font-style:italic; margin-left:8px;">${ex.note}</small>` : ''}
                    </div>
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <button onclick="moveEx('${ex.id}', -1)" class="nav-arrow" style="padding:2px 8px; font-size:0.6rem;">▲</button>
                        <button onclick="moveEx('${ex.id}', 1)" class="nav-arrow" style="padding:2px 8px; font-size:0.6rem;">▼</button>
                    </div>
                    <button onclick="confirm('Eliminare?') && window.deleteDoc(window.doc(window.db, 'users', window.currentUser.uid, 'routine', '${ex.id}'))" style="background:var(--danger); border:none; color:white; border-radius:4px; padding:5px 8px; cursor:pointer;">X</button>
                </div>`).join('');
        };

        window.showTab = (id) => {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelector(`button[onclick="showTab('${id}')"]`).classList.add('active');
            if(id === 'main') { renderChart(); renderHeatmap(); }
            if(id === 'analisi') renderAnalisi();
            if(id === 'history') renderHistory();
            if(id === 'routine') renderRoutine();
            if(id === 'input') document.getElementById('dateIn').valueAsDate = new Date();
        };

        window.changeWeek = (days) => { window.referenceDate.setDate(window.referenceDate.getDate() + days); renderChart(); };

        window.renderChart = () => {
            const monday = getMonday(window.referenceDate);
            const labels = []; for(let i=0; i<7; i++) { let d = new Date(monday); d.setDate(monday.getDate()+i); labels.push(formatDateLocal(d)); }
            document.getElementById('currentWeekLabel').innerText = `Sett. ${monday.getDate()}/${monday.getMonth()+1}`;
            
            const grouped = window.fitnessDB.reduce((acc, curr) => {
                if(!acc[curr.date]) acc[curr.date] = { weight: null, activities: [] };
                if(curr.type !== 'Riposo') acc[curr.date].activities.push(curr.type);
                if(curr.weight) acc[curr.date].weight = curr.weight; return acc;
            }, {});

            let score = 0;
            labels.forEach(day => {
                const acts = window.fitnessDB.filter(r => r.date === day);
                if(acts.some(r => !['Stretching', 'Riposo'].includes(r.type))) score += 1;
                else if(acts.some(r => r.type === 'Stretching')) score += 0.5;
            });

            document.getElementById('costanzaVal').innerText = `${score} / 7 Punti`;
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels.map(l => l.split('-').reverse().slice(0,2).join('/')), 
                        datasets: [{ data: labels.map(l => grouped[l]?.weight || null), borderColor: '#38bdf8', tension: 0.3, spanGaps: true }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 73, max: 82 } } },
                plugins: [{
                    afterDraw: chart => {
                        chart.data.datasets[0].data.forEach((v, i) => {
                            const meta = chart.getDatasetMeta(0); if(!meta.data[i]) return;
                            const {x, y} = meta.data[i]; const acts = grouped[labels[i]]?.activities || [];
                            acts.forEach((a, idx) => { chart.ctx.font = '14px serif'; chart.ctx.fillText(icons[a] || '⚪', x-7, y - 20 - (idx*16)); });
                        });
                    }
                }]
            });
        };

        window.renderHeatmap = () => {
            const container = document.getElementById('annualHeatmap'); container.innerHTML = '';
            const currentYear = new Date().getFullYear();
            for (let w = 1; w <= 52; w++) {
                let wScore = 0;
                const records = window.fitnessDB.filter(r => { const d = new Date(r.date); return d.getFullYear() === currentYear && getWeekNumber(d) === w; });
                const days = [...new Set(records.map(r => r.date))];
                days.forEach(d => {
                    const acts = records.filter(r => r.date === d);
                    if(acts.some(r => !['Stretching', 'Riposo'].includes(r.type))) wScore += 1;
                    else if(acts.some(r => r.type === 'Stretching')) wScore += 0.5;
                });
                const el = document.createElement('div'); el.className = 'heat-day';
                el.innerHTML = `<span style="font-size:0.5rem; opacity:0.5;">${w}</span><b>${wScore}</b>`;
                if(wScore >= 5) el.classList.add('heat-ultra'); else if(wScore >= 3.5) el.classList.add('heat-high');
                else if(wScore >= 2) el.classList.add('heat-mid'); else if(wScore > 0) el.classList.add('heat-low');
                el.onclick = () => {
                    let target = new Date(currentYear, 0, 4); target.setDate(target.getDate() + (w - 1) * 7);
                    window.referenceDate = getMonday(target); renderChart(); window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                container.appendChild(el);
            }
        };

        window.renderAnalisi = () => {
            const sport = document.getElementById('sportFilter').value;
            const daysCount = parseInt(document.getElementById('periodFilter').value);
            const labelsRaw = []; const labelsFmt = [];
            for(let i=daysCount-1; i>=0; i--) {
                let d = new Date(); d.setDate(d.getDate()-i);
                labelsRaw.push(formatDateLocal(d));
                labelsFmt.push(formatDateLocal(d).split('-').reverse().slice(0,2).join('/'));
            }

            const dataSeries = labelsRaw.map(date => {
                const dayRecords = window.fitnessDB.filter(r => r.date === date);
                if (sport === 'Peso') {
                    const rec = dayRecords.find(r => r.weight > 0); return rec ? rec.weight : null;
                } else {
                    return dayRecords.filter(r => r.type === sport).reduce((sum, r) => sum + (r.min || 0), 0);
                }
            });

            if(analisiChart) analisiChart.destroy();
            analisiChart = new Chart(document.getElementById('analysisChart').getContext('2d'), {
                type: 'line',
                data: { labels: labelsFmt, datasets: [{ data: dataSeries, borderColor: '#a855f7', tension: 0.3, spanGaps: true }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const tc = document.getElementById('sportTiles');
            tc.innerHTML = ['Corsa', 'Padel', 'Stretching', 'Pesi', 'Routine'].map(s => `
                <div class="sport-tile ${sport === s ? 'active' : ''}" onclick="document.getElementById('sportFilter').value='${s}'; renderAnalisi();">
                    <span>${icons[s]}</span><br><b>${window.fitnessDB.filter(r => labelsRaw.includes(r.date) && r.type === s).length}</b>
                </div>`).join('');
        };

        window.renderHistory = () => {
            document.getElementById('historyList').innerHTML = [...window.fitnessDB].reverse().map(r => `
                <div style="background:var(--card); padding:12px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; border:1px solid #334155;">
                    <div><small>${r.date}</small> <br> ${icons[r.type]} <b>${r.type}</b> ${r.weight ? ' | '+r.weight+'kg' : ''}</div>
                    <button onclick="handleDelete('${r.id}')" style="background:var(--danger); color:white; border:none; border-radius:5px; padding:0 10px;">X</button>
                </div>`).join('');
        };

        window.toggleFields = () => {
            const t = document.getElementById('typeIn').value;
            document.getElementById('kmBox').classList.toggle('hidden', t !== 'Corsa');
            document.getElementById('minBox').classList.toggle('hidden', !['Corsa','Padel','Stretching','Routine'].includes(t));
        };
    </script>
</body>
</html>
